<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ProspectPro — Prospection IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    :root {
      --bg:#05001a; --bg2:#080024; --bg3:#0a0030;
      --card:rgba(255,255,255,0.04); --card2:rgba(255,255,255,0.07);
      --border:rgba(139,92,246,0.22); --border2:rgba(255,255,255,0.07); --border3:rgba(139,92,246,0.4);
      --text:#f0ebff; --text2:#9ca3af; --text3:#6b7280;
      --v:#7c3aed; --p:#a855f7; --f:#ec4899; --pi:#c084fc;
      --grad:linear-gradient(135deg,#7c3aed,#ec4899);
      --grad2:linear-gradient(135deg,#a855f7,#f472b6);
      --grad3:linear-gradient(135deg,#6d28d9,#be185d);
      --glow:0 0 40px rgba(124,58,237,0.4);
    }
    html { scroll-behavior: smooth }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button { cursor: pointer; border: none; font-family: inherit }
    input, select, textarea { font-family: inherit }
    a { text-decoration: none; color: inherit }
    #app { min-height: 100vh }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 28px }

    /* ── APP NAV ── */
    .app-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(5,0,26,0.88);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
    }
    .app-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; cursor: pointer; letter-spacing: -0.3px }
    .app-logo-icon {
      width: 36px; height: 36px; background: var(--grad); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 17px;
      box-shadow: 0 0 16px rgba(124,58,237,0.4);
    }
    .nav-pills {
      display: flex; align-items: center; gap: 2px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 50px; padding: 4px;
    }
    .nav-pill {
      padding: 7px 16px; border-radius: 50px; font-size: 13px; font-weight: 500;
      color: var(--text2); transition: all .2s; background: none; border: none; cursor: pointer; letter-spacing: -0.1px;
    }
    .nav-pill.active { background: var(--grad); color: #fff; font-weight: 600; box-shadow: 0 2px 10px rgba(124,58,237,0.4) }
    .nav-pill:hover:not(.active) { color: var(--pi); background: rgba(139,92,246,0.08) }
    .nav-user { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2) }
    .nav-avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--grad);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .btn-out {
      background: none; color: var(--text3); font-size: 13px; padding: 6px 12px;
      border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: all .2s; font-weight: 500;
    }
    .btn-out:hover { color: var(--pi); border-color: var(--border); background: rgba(139,92,246,0.06) }
    .mob-nav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(5,0,26,0.97); border-top: 1px solid var(--border);
      padding: 8px 0; padding-bottom: max(8px,env(safe-area-inset-bottom));
    }
    .mob-nav-inner { display: flex; justify-content: space-around }
    .mob-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 14px; color: var(--text3); font-size: 10px; font-weight: 500;
      cursor: pointer; background: none; border: none; transition: color .2s; min-width: 64px;
    }
    .mob-btn span.ic { font-size: 20px }
    .mob-btn.active { color: var(--p) }
    @media(max-width:768px) {
      .app-nav .nav-pills, .app-nav .nav-user span.nav-name { display: none }
      .mob-nav { display: block }
    }

    /* ── PAGE ── */
    .page { padding: 88px 28px 28px; max-width: 1280px; margin: 0 auto }
    @media(max-width:768px) { .page { padding: 80px 16px 96px } }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 20px; border-radius: 11px; font-weight: 600; font-size: 14px;
      transition: all .2s; border: none; cursor: pointer; letter-spacing: -0.2px;
    }
    .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 4px 16px rgba(124,58,237,0.3) }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(124,58,237,0.5) }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none }
    .btn-ghost { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border2) }
    .btn-ghost:hover { border-color: var(--border); color: var(--pi); background: rgba(139,92,246,0.07) }
    .btn-danger { background: rgba(239,68,68,.1); color: #f87171; border: 1px solid rgba(239,68,68,.2) }
    .btn-danger:hover { background: rgba(239,68,68,.2) }
    .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 9px }

    /* ── CARDS ── */
    .card { background: var(--card); border: 1px solid var(--border2); border-radius: 18px; padding: 20px }
    .card-hov { transition: border-color .2s, transform .25s, box-shadow .2s }
    .card-hov:hover { border-color: rgba(139,92,246,0.4); transform: translateY(-3px); box-shadow: 0 12px 32px rgba(124,58,237,0.14) }

    /* ── FORMS ── */
    .fg { margin-bottom: 14px }
    .fl { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px }
    .fi {
      width: 100%; padding: 10px 14px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border2);
      border-radius: 10px; color: var(--text); font-size: 14px; outline: none; transition: all .2s;
    }
    .fi:focus { border-color: var(--p); background: rgba(139,92,246,0.05); box-shadow: 0 0 0 3px rgba(139,92,246,0.1) }
    .fi::placeholder { color: var(--text3) }
    select.fi { cursor: pointer }
    textarea.fi { resize: vertical; min-height: 72px }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
    @media(max-width:580px) { .g2 { grid-template-columns: 1fr } }

    /* ── MODAL ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .modal {
      background: #08001f; border: 1px solid var(--border);
      border-radius: 22px; padding: 30px;
      width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.1);
    }
    .modal h3 { font-size: 17px; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.3px }
    .modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px }

    /* ── BADGE / LIST ── */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 30px; font-size: 11px; font-weight: 600 }
    .list-row {
      display: flex; align-items: center; gap: 13px;
      padding: 14px 20px; border-bottom: 1px solid rgba(139,92,246,0.07); transition: background .15s;
    }
    .list-row:last-child { border-bottom: none }
    .list-row:hover { background: rgba(139,92,246,0.04) }
    .ibt { background: none; border: none; color: var(--text3); padding: 6px 8px; border-radius: 8px; transition: all .15s; font-size: 13px; cursor: pointer }
    .ibt:hover { background: rgba(255,255,255,0.08); color: var(--text) }
    .ibt.del:hover { background: rgba(239,68,68,0.12); color: #f87171 }

    /* ── STATS ── */
    .stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 22px }
    @media(max-width:640px) { .stat-grid { grid-template-columns: repeat(2,1fr) } }
    .stat-card {
      background: var(--card); border: 1px solid var(--border2);
      border-radius: 18px; padding: 20px; transition: all .2s;
    }
    .stat-card:hover { border-color: rgba(139,92,246,0.3); transform: translateY(-2px) }
    .stat-ico { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 12px }
    .stat-val { font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -1px }
    .stat-lbl { font-size: 11px; color: var(--text2); margin-top: 4px; font-weight: 500 }

    /* ── SEARCH ── */
    .search-bar { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid rgba(139,92,246,0.08) }
    .sw { position: relative; flex: 1; min-width: 160px }
    .sw-ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; pointer-events: none }
    .si {
      width: 100%; padding: 9px 11px 9px 34px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border2);
      border-radius: 10px; color: var(--text); font-size: 13px; outline: none; transition: all .2s;
    }
    .si:focus { border-color: var(--p); box-shadow: 0 0 0 3px rgba(139,92,246,0.1) }
    .si::placeholder { color: var(--text3) }
    .sfl {
      padding: 9px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border2);
      border-radius: 10px; color: var(--text); font-size: 13px; outline: none; cursor: pointer; transition: border-color .2s;
    }
    .sfl:focus { border-color: var(--p) }

    /* ── PAGE HEADER / EMPTY ── */
    .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; flex-wrap: wrap; gap: 10px }
    .pt { font-size: 23px; font-weight: 800; background: var(--grad2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; letter-spacing: -0.5px }
    .ps { color: var(--text2); font-size: 13px; margin-top: 2px }
    .empty { text-align: center; padding: 64px 24px }
    .empty-ic { font-size: 48px; margin-bottom: 12px; opacity: .2 }
    .empty-t { font-weight: 700; color: var(--text2); margin-bottom: 5px; font-size: 15px }
    .empty-s { color: var(--text3); font-size: 13px; margin-bottom: 20px }

    /* ── AUTH ── */
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; overflow: hidden }
    .auth-box {
      position: relative; z-index: 2; width: 100%; max-width: 420px;
      background: rgba(8,0,31,0.94); border: 1px solid var(--border);
      border-radius: 24px; padding: 36px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(139,92,246,0.1);
    }
    .auth-logo { text-align: center; margin-bottom: 28px }
    .auth-logo-ic {
      width: 54px; height: 54px; background: var(--grad); border-radius: 16px;
      display: flex; align-items: center; justify-content: center; font-size: 26px;
      margin: 0 auto 12px; box-shadow: var(--glow);
    }
    .auth-t { font-size: 22px; font-weight: 800; letter-spacing: -0.5px }
    .auth-s { color: var(--text2); font-size: 13px; margin-top: 4px }
    .auth-err { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #f87171; margin-bottom: 16px }
    .auth-foot { margin-top: 18px; text-align: center; font-size: 13px; color: var(--text2) }
    .auth-foot a { color: var(--pi); cursor: pointer; font-weight: 500 }

    /* ── LANDING ── */
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; padding: 110px 24px 80px }
    .hero-paths { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
    .hc { position: relative; z-index: 2; max-width: 840px; margin: 0 auto }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(124,58,237,0.12); border: 1px solid rgba(139,92,246,0.4);
      border-radius: 50px; padding: 7px 18px; color: var(--pi); font-size: 12px;
      font-weight: 600; margin-bottom: 32px;
    }
    .hero-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--p); box-shadow: 0 0 8px var(--p); display: inline-block; animation: pulse 2s infinite }
    .hero-title { font-size: clamp(3rem,8vw,6.5rem); font-weight: 900; line-height: 1.03; letter-spacing: -3px; margin-bottom: 26px }
    .hero-title span { background: var(--grad2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent }
    .hero-sub { color: #c4b5d6; font-size: clamp(1rem,2.3vw,1.15rem); line-height: 1.75; max-width: 560px; margin: 0 auto 44px }
    .hero-cta {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--grad); color: #fff; font-weight: 700; font-size: 16px;
      padding: 17px 42px; border-radius: 14px;
      box-shadow: 0 0 40px rgba(124,58,237,0.45), 0 4px 20px rgba(0,0,0,0.3);
      transition: transform .2s, box-shadow .2s; letter-spacing: -0.3px;
    }
    .hero-cta:hover { transform: translateY(-3px); box-shadow: 0 8px 50px rgba(124,58,237,0.7) }
    .hero-proof { margin-top: 32px; color: var(--text3); font-size: 12px }
    .hero-metrics { display: flex; align-items: center; justify-content: center; gap: 32px; margin-top: 56px; flex-wrap: wrap }
    .hero-metric { text-align: center }
    .hero-metric-val { font-size: 28px; font-weight: 900; background: var(--grad2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; letter-spacing: -1px }
    .hero-metric-lbl { font-size: 11px; color: var(--text3); margin-top: 2px }
    .hero-metric-div { width: 1px; height: 36px; background: var(--border2) }
    .land-sec { padding: 96px 0 }
    .alt-sec { background: rgba(139,92,246,0.03); border-top: 1px solid rgba(139,92,246,0.1); border-bottom: 1px solid rgba(139,92,246,0.1) }
    .sl { color: var(--p); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 4px; display: block; margin-bottom: 12px }
    .st { font-size: clamp(1.9rem,3.5vw,2.8rem); font-weight: 900; line-height: 1.12; margin-bottom: 12px; letter-spacing: -1px }
    .ss { color: var(--text2); font-size: 16px; line-height: 1.6 }
    .feat-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 18px; margin-top: 52px }
    .feat-card {
      background: var(--card); border: 1px solid var(--border2);
      border-radius: 20px; padding: 28px; transition: all .3s; position: relative; overflow: hidden;
    }
    .feat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--grad); transform: scaleX(0); transition: transform .3s; transform-origin: left;
    }
    .feat-card:hover { border-color: rgba(139,92,246,0.4); transform: translateY(-5px); box-shadow: 0 16px 40px rgba(124,58,237,0.14) }
    .feat-card:hover::before { transform: scaleX(1) }
    .feat-ic { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 16px; background: rgba(124,58,237,0.14) }
    .feat-t { font-size: 15px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.2px }
    .feat-d { color: var(--text2); font-size: 13px; line-height: 1.65 }
    .feat-hl { color: var(--pi); font-weight: 600 }
    .steps-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 24px; margin-top: 48px }
    .step-n { font-size: 48px; font-weight: 900; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; margin-bottom: 12px; line-height: 1 }
    .step-t { font-size: 17px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.3px }
    .step-d { color: var(--text2); font-size: 13px; line-height: 1.65 }
    .testi-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 18px; margin-top: 48px }
    .testi { background: var(--card); border: 1px solid var(--border2); border-radius: 18px; padding: 24px }
    .testi-stars { color: #f59e0b; font-size: 13px; margin-bottom: 12px; letter-spacing: 2px }
    .testi-txt { color: #c4b5d6; font-size: 13px; line-height: 1.7; margin-bottom: 16px; font-style: italic }
    .testi-name { font-weight: 700; font-size: 13px }
    .testi-role { color: var(--text2); font-size: 11px; margin-top: 2px }
    .price-card {
      max-width: 480px; margin: 52px auto 0;
      background: linear-gradient(135deg,rgba(124,58,237,0.1),rgba(236,72,153,0.07));
      border: 1px solid rgba(139,92,246,0.3); border-radius: 24px; padding: 42px; text-align: center;
      position: relative; overflow: hidden;
    }
    .price-card::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 200px; height: 2px; background: var(--grad) }
    .price-tag { font-size: 72px; font-weight: 900; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; line-height: 1; letter-spacing: -4px }
    .price-sub { color: var(--text2); margin: 6px 0 28px }
    .price-feat { list-style: none; text-align: left; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 32px }
    .price-feat li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #d1d5db }
    .price-feat li::before { content: '✓'; color: var(--p); font-weight: 700 }
    .land-foot { border-top: 1px solid var(--border); padding: 32px 24px; text-align: center; color: var(--text3); font-size: 13px }

    /* ── DEMO ── */
    .demo-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-top: 52px }
    @media(max-width:900px) { .demo-grid { grid-template-columns: 1fr } }
    .demo-main {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 22px; padding: 10px; position: relative; overflow: hidden; min-height: 380px; display: flex;
    }
    .demo-play {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(5,0,26,0.4); cursor: pointer; transition: background .3s; border: none; border-radius: 16px;
    }
    .demo-play:hover { background: rgba(5,0,26,0.2) }
    .demo-play span {
      width: 76px; height: 76px; border-radius: 50%; background: var(--grad);
      display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff;
      box-shadow: 0 0 48px rgba(124,58,237,0.7);
    }
    .demo-feats { display: grid; grid-template-rows: repeat(4,1fr); gap: 12px }
    .demo-feat { background: rgba(255,255,255,0.03); border: 1px solid var(--border2); border-radius: 15px; padding: 14px 18px; transition: all .25s }
    .demo-feat:hover { border-color: rgba(139,92,246,0.4); transform: translateX(4px) }
    .demo-feat h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px }
    .demo-feat p { font-size: 12px; color: var(--text2); line-height: 1.5 }
    .integ-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-top: 44px }
    @media(max-width:760px) { .integ-grid { grid-template-columns: repeat(2,1fr) } }
    .integ { display: flex; align-items: center; gap: 11px; padding: 13px; border-radius: 14px; transition: background .2s }
    .integ:hover { background: rgba(139,92,246,0.08) }
    .integ-ic { width: 40px; height: 40px; border-radius: 11px; background: rgba(124,58,237,0.13); display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0 }
    .integ-n { font-size: 13px; font-weight: 600 }
    .integ-s { font-size: 11px; color: var(--text2) }

    /* ── CHATBOT ── */
    .chat-fab {
      position: fixed; bottom: 80px; right: 20px; z-index: 200;
      width: 52px; height: 52px; background: var(--grad); border-radius: 50%;
      border: none; color: #fff; font-size: 20px; cursor: pointer;
      box-shadow: 0 4px 24px rgba(124,58,237,0.5); transition: transform .2s;
      display: none; align-items: center; justify-content: center;
    }
    .chat-fab:hover { transform: scale(1.1) }
    .chat-fab.show { display: flex }
    @media(min-width:769px) { .chat-fab { bottom: 24px } }
    .chat-panel {
      position: fixed; bottom: 92px; right: 20px; width: 330px;
      background: #08001f; border: 1px solid var(--border);
      border-radius: 20px; z-index: 200; box-shadow: 0 24px 64px rgba(0,0,0,0.6);
      display: none; flex-direction: column;
    }
    .chat-panel.open { display: flex }
    @media(min-width:769px) { .chat-panel { bottom: 86px } }
    @media(max-width:400px) { .chat-panel { right: 0; left: 0; width: auto; border-radius: 20px 20px 0 0; bottom: 70px } }

/* ── STORAGE ── */
const S={
  get:(k,d=null)=>{ try{ return JSON.parse(localStorage.getItem(k))??d }catch{ return d } },
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),
  del:(k)=>localStorage.removeItem(k),
}

/* ── AUTH ── */
const Auth={
  me:()=>S.get('pp_me'),
  loggedIn:()=>!!Auth.me(),
  register(name,email,pw){
    const users=S.get('pp_users',[])
    if(users.find(u=>u.email.toLowerCase()===email.toLowerCase())) return{err:'Email déjà utilisé.'}
    const u={id:uid(),name,email,pw,at:Date.now()}
    users.push(u); S.set('pp_users',users); S.set('pp_me',{id:u.id,name,email})
    return{ok:true}
  },
  login(email,pw){
    const u=S.get('pp_users',[]).find(u=>u.email.toLowerCase()===email.toLowerCase()&&u.pw===pw)

    S.set('pp_me',{id:u.id,name:u.name,email:u.email}); return{ok:true}
  },
  logout(){S.del('pp_me');go('#/')}
}

/* ── DATABASE ── */
function mk(t){
  const key=()=>`pp_${Auth.me()?.id}_${t}`
  return{
    all:()=>S.get(key(),[]),
    add:(o)=>{ const d=mk(t).all(); d.unshift({...o,id:uid(),at:Date.now()}); S.set(key(),d) },
    upd:(id,o)=>S.set(key(),mk(t).all().map(x=>x.id===id?{...x,...o}:x)),
    del:(id)=>S.set(key(),mk(t).all().filter(x=>x.id!==id)),
  }
}

async function askAI(system,userMsg){

  })
  if(!r.ok) throw new Error('Erreur API ('+r.status+')')
  const d=await r.json()
  if(d.error) throw new Error(d.error)
  return d.content?.[0]?.text||''
}

/* ── MAGNETIC ── */
function bindMagnetic(){
  if(window.innerWidth<900) return
  document.querySelectorAll('.magnetic').forEach(el=>{
    if(el.dataset.mag) return
    el.dataset.mag='1'
    el.style.transition='transform .25s cubic-bezier(.2,.8,.2,1)'
    el.addEventListener('mousemove',e=>{
      const r=el.getBoundingClientRect()
      el.style.transform=`translate(${(e.clientX-(r.left+r.width/2))*0.35}px,${(e.clientY-(r.top+r.height/2))*0.45}px)`
    })
    el.addEventListener('mouseleave',()=>{ el.style.transform='translate(0,0)' })
  })
}

        ${Object.entries(PS).map(([v,ss])=>`<option value="${v}"${p.status===v?' selected':''}>${ss.l}</option>`).join('')}
      </select>
      <div style="display:flex;gap:3px"><button class="ibt" onclick="openPM('${p.id}')">✏️</button><button class="ibt del" onclick="delP('${p.id}')">🗑️</button></div>
    </div>`
  }).join('')
}
function openPM(id){
  const m=$('#pm'); if(!m) return; m.style.display='flex'
  if(id){ const p=Pros.all().find(x=>x.id===id); if(!p) return; $('#pmt').textContent='Modifier le prospect'; $('#pid').value=p.id; $('#pest').value=p.establishment||''; $('#pdom').value=p.domain||''; $('#pcnt').value=p.contact||''; $('#pst').value=p.status||'to_call'; $('#pno').value=p.notes||'' }
  else{ $('#pmt').textContent='Nouveau prospect'; $('#pid').value=''; $('#pest').value=''; $('#pdom').value=''; $('#pcnt').value=''; $('#pst').value='to_call'; $('#pno').value='' }
}
function closePM(){ const m=$('#pm'); if(m) m.style.display='none' }
function saveP(){
  const est=$('#pest').value.trim(); if(!est){ toast('Établissement requis.','err'); return }
  const f={establishment:est,domain:$('#pdom').value.trim(),contact:$('#pcnt').value.trim(),status:$('#pst').value,notes:$('#pno').value.trim()}
  const id=$('#pid').value
  if(id){ Pros.upd(id,f); toast('Prospect mis à jour !') } else { Pros.add(f); toast('Prospect ajouté !') }
  closePM(); PAGES['#/cold-call']()
}
function delP(id){ if(!confirm('Supprimer ce prospect ?')) return; Pros.del(id); toast('Prospect supprimé.'); PAGES['#/cold-call']() }

/* ════════════════════════════════════════
   PAGE: SCRIPTS
════════════════════════════════════════ */
const PRESETS={
  'Cold Call B2B':`**OUVERTURE**\nBonjour [Prénom], c'est [Votre Nom] de [Votre Société].\nJe vous appelle car nous accompagnons des entreprises de votre secteur à [bénéfice clé].\nJ'aurais 2 questions rapides — 90 secondes top chrono, c'est possible ?\n\n**PITCH**\nActuellement, comment gérez-vous [problème principal] ?\nNos clients comme [référence] ont réussi à [résultat concret] en [délai].\nCe qui nous différencie, c'est [avantage unique].\n\n**OBJECTIONS & CLOSING**\n"Pas le temps" → "C'est justement pour ça que j'appelle — 15 min suffisent. Mardi ou jeudi ?"\n"Envoyez un email" → "Bien sûr, pour cibler ma réponse : [question clé]"\n"On est équipés" → "Super ! Est-ce que ça vous donne [résultat spécifique] ?"`,
  'Relance chaude':`**OUVERTURE**\nBonjour [Prénom], c'est [Votre Nom] de [Votre Société].\nJe vous recontacte suite à notre dernier échange — avez-vous pu réfléchir à notre proposition ?\n\n**PITCH**\nDepuis notre dernier contact, un client similaire a [résultat concret].\nJe voulais vous partager ça car c'est exactement le cas de figure dont on avait parlé.\n\n**OBJECTIONS & CLOSING**\n"Toujours en réflexion" → "Qu'est-ce qui freine la décision ? Je peux peut-être vous apporter un éclairage."\nOn pourrait faire un point de 20 min cette semaine — mardi 10h ou jeudi 14h ?`,
  'Objections':`**"Je n'ai pas le temps"**\n→ "Je comprends, c'est pour ça que je suis direct : j'ai juste 2 questions. 90 secondes max ?"\n\n**"Envoyez-moi un email"**\n→ "Avec plaisir. Pour cibler ma réponse, j'ai juste besoin de savoir : [question clé]. 10 secondes ?"\n\n**"On a déjà un prestataire"**\n→ "Très bien ! Est-ce qu'il vous garantit [résultat spécifique] ? C'est souvent là qu'on fait la différence."\n\n**"C'est trop cher"**\n→ "Je comprends. Quel budget avez-vous en tête ? Et si on calcule ensemble le ROI..."\n\n**"Rappelez-moi dans 3 mois"**\n→ "Bien sûr. Pour que mon rappel soit utile, qu'est-ce qui aura changé d'ici là ?"`,
  'Closing RDV':`**OUVERTURE**\nBonjour [Prénom], vous avez posé d'excellentes questions — je pense vraiment qu'on peut vous aider sur [point précis].\n\n**PITCH**\nLa prochaine étape logique serait un appel de 20 minutes pour vous montrer concrètement comment [résultat].\nJe l'ai fait récemment avec [référence secteur] — ils ont [résultat rapide].\n\n**CLOSING**\nJe suis disponible mardi ou jeudi matin — qu'est-ce qui vous convient ?\n[Si hésitation] : Ce n'est pas un engagement. Juste 20 min pour voir si c'est pertinent. Et si ce n'est pas le cas, je vous le dis directement.`,
}
PAGES['#/scripts']=function(){
  $('#app').innerHTML=`${nav('#/scripts')}
  <div class="page">
    <div class="ph"><div><h1 class="pt">Générateur de Scripts IA</h1><p class="ps">Script personnalisé en quelques secondes</p></div></div>
    <div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px" class="scripts-cols">
      <div class="card">
        <p style="font-size:15px;font-weight:700;margin-bottom:20px;letter-spacing:-0.3px">✨ Paramètres</p>
        <div class="fg"><label class="fl">Nom du prospect *</label><input id="sn" class="fi" placeholder="Ex: Jean Martin"></div>
        <div class="fg"><label class="fl">Entreprise *</label><input id="sc" class="fi" placeholder="Ex: Restaurant Le Gourmet"></div>
        <div class="fg"><label class="fl">Secteur d'activité</label><input id="ss" class="fi" placeholder="Ex: Restauration, IT, Immobilier..."></div>
        <div class="fg"><label class="fl">Type d'appel</label><select id="st" class="fi"><option>Prospection (1er contact)</option><option>Relance</option><option>Closing</option><option>Service client</option></select></div>
        <div class="fg"><label class="fl">Info clé 1 (optionnel)</label><input id="si1" class="fi" placeholder="Ex: A récemment ouvert un 2e site"></div>
        <div class="fg"><label class="fl">Info clé 2 (optionnel)</label><input id="si2" class="fi" placeholder="Ex: Concurrent de X"></div>
        <div class="fg"><label class="fl">Info clé 3 (optionnel)</label><input id="si3" class="fi" placeholder="Ex: Cherche à digitaliser"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" id="sgen" onclick="genScript()">✨ Générer le script IA</button>
      </div>
      <div>
        <div id="sout" style="min-height:300px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text3);border:2px dashed rgba(139,92,246,0.2);border-radius:16px;padding:40px">
          <div><div style="font-size:48px;margin-bottom:16px;opacity:0.4">✨</div><p style="font-size:15px;font-weight:600;margin-bottom:8px;color:var(--text2)">Votre script apparaîtra ici</p><p style="font-size:13px">Remplissez le formulaire et cliquez sur Générer</p></div>
        </div>
        <div style="margin-top:20px">
          <p style="font-size:13px;font-weight:700;margin-bottom:14px;letter-spacing:-0.2px">📚 Scripts prêts à l'emploi</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            ${[{t:'Cold Call B2B',d:'1er contact',ic:'❄️'},{t:'Relance chaude',d:'Prospect connu',ic:'🔥'},{t:'Objections',d:'Réponses clés',ic:'🛡️'},{t:'Closing RDV',d:'Décrocher le RDV',ic:'🎯'}].map(s=>`<div class="card card-hov" style="cursor:pointer;padding:15px" onclick="loadPreset('${s.t}')"><div style="font-size:22px;margin-bottom:8px">${s.ic}</div><p style="font-weight:700;font-size:13px;margin:0 0 3px;letter-spacing:-0.1px">${s.t}</p><p style="font-size:11px;color:var(--text2);margin:0">${s.d}</p></div>`).join('')}
          </div>
        </div>
      </div>
    </div>
  </div>
  ${chatWidget()}`
}
async function genScript(){
  const n=$('#sn').value.trim(),c=$('#sc').value.trim()
  if(!n||!c){ toast('Nom et entreprise requis.','err'); return }
  const s=$('#ss').value.trim(),t=$('#st').value
  const infos=[$('#si1').value.trim(),$('#si2').value.trim(),$('#si3').value.trim()].filter(Boolean)
  const btn=$('#sgen'); btn.textContent='⏳ Génération...'; btn.disabled=true
  $('#sout').innerHTML=`<div style="padding:60px;text-align:center;color:var(--text2)"><div style="font-size:32px;margin-bottom:12px">⏳</div>Génération du script en cours...</div>`
  try{
    const res=await askAI(
      `Tu es un expert en vente B2B et prospection commerciale. Tu génères des scripts d'appel professionnels et naturels en français. Structure toujours en 3 parties: **OUVERTURE** (accroche 3 lignes), **PITCH** (valeur + questions 4-5 lignes), **OBJECTIONS & CLOSING** (réponses + demande RDV 4-5 lignes).`,
      `Génère un script de type "${t}" pour:\n- Prospect: ${n}, ${c}${s?`\n- Secteur: ${s}`:''}${infos.length?`\n- Infos clés: ${infos.join(', ')}`:''}.\nLe script doit être naturel, personnalisé et finir par une proposition de RDV.`
    )
    showScript(`✨ Script pour ${n} — ${c}`,res)
  }catch(e){ $('#sout').innerHTML=`<div class="card" style="border-color:rgba(239,68,68,.3);color:#f87171;padding:20px">❌ ${esc(e.message)}</div>` }
  btn.textContent='✨ Générer le script IA'; btn.disabled=false
}
function loadPreset(t){ if(PRESETS[t]) showScript(`📝 ${t}`,PRESETS[t]) }
function showScript(title,text){
  $('#sout').innerHTML=`<div class="script-out">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span style="font-weight:700;color:var(--pi);font-size:13px">${esc(title)}</span>
      <button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('stxt').innerText).then(()=>toast('Copié !'))">📋 Copier</button>
    </div>
    <pre id="stxt" style="white-space:pre-wrap;font-size:13px;line-height:1.85;color:#e2d9f3;font-family:inherit">${esc(text)}</pre>
  </div>`
}
