<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ProspectPro — Prospection IA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    :root {
      --bg:#000; --bg2:#0a0015; --bg3:#0d001f;
      --card:rgba(255,255,255,0.04); --border:rgba(168,85,247,0.18); --border2:rgba(255,255,255,0.08);
      --text:#fff; --text2:#9ca3af; --text3:#6b7280;
      --v:#7c3aed; --p:#a855f7; --f:#ec4899;
      --grad:linear-gradient(135deg,#7c3aed,#ec4899);
      --grad2:linear-gradient(135deg,#a855f7,#ec4899);
    }
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
    button{cursor:pointer;border:none;font-family:inherit}
    input,select,textarea{font-family:inherit}
    a{text-decoration:none;color:inherit}
    #app{min-height:100vh}
    .container{max-width:1100px;margin:0 auto;padding:0 24px}

    /* ── APP NAV ── */
    .app-nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .app-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;cursor:pointer}
    .app-logo-icon{width:36px;height:36px;background:var(--grad);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .nav-pills{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:40px;padding:4px}
    .nav-pill{padding:7px 14px;border-radius:40px;font-size:13px;font-weight:500;color:var(--text2);transition:all .2s;background:none;border:none;cursor:pointer}
    .nav-pill.active{background:var(--grad);color:#fff;font-weight:700}
    .nav-pill:hover:not(.active){color:#fff;background:rgba(255,255,255,0.07)}
    .nav-user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}
    .btn-out{background:none;color:var(--text3);font-size:13px;padding:7px 12px;border-radius:8px;border:none;cursor:pointer;transition:color .2s}
    .btn-out:hover{color:var(--p)}
    /* MOBILE NAV */
    .mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(0,0,0,0.96);border-top:1px solid var(--border);padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom))}
    .mob-nav-inner{display:flex;justify-content:space-around}
    .mob-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;color:var(--text3);font-size:10px;font-weight:500;cursor:pointer;background:none;border:none;transition:color .2s;min-width:60px}
    .mob-btn span.ic{font-size:20px}
    .mob-btn.active{color:var(--p)}
    @media(max-width:768px){
      .app-nav .nav-pills,.app-nav .nav-user span{display:none}
      .mob-nav{display:block}
    }

    /* ── PAGE ── */
    .page{padding:88px 24px 24px;max-width:1280px;margin:0 auto}
    @media(max-width:768px){.page{padding:80px 16px 90px}}

    /* ── BUTTONS ── */
    .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:11px;font-weight:600;font-size:14px;transition:all .2s;border:none;cursor:pointer}
    .btn-primary{background:var(--grad);color:#fff;box-shadow:0 0 20px rgba(124,58,237,.3)}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(124,58,237,.5)}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
    .btn-ghost:hover{border-color:var(--p);color:var(--p)}
    .btn-danger{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.2)}
    .btn-danger:hover{background:rgba(239,68,68,.22)}
    .btn-sm{padding:7px 14px;font-size:12px;border-radius:9px}

    /* ── CARDS ── */
    .card{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:20px}
    .card-hov{transition:border-color .2s,transform .25s,box-shadow .2s}
    .card-hov:hover{border-color:rgba(168,85,247,.35);transform:translateY(-3px);box-shadow:0 8px 30px rgba(124,58,237,.12)}

    /* ── FORMS ── */
    .fg{margin-bottom:14px}
    .fl{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
    .fi{width:100%;padding:10px 13px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
    .fi:focus{border-color:var(--p)}
    .fi::placeholder{color:var(--text3)}
    select.fi{cursor:pointer}
    textarea.fi{resize:vertical;min-height:72px}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:580px){.g2{grid-template-columns:1fr}}

    /* ── MODAL ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
    .modal{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
    .modal h3{font-size:17px;font-weight:800;margin-bottom:18px}
    .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

    /* ── BADGE / LIST ── */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
    .list-row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid rgba(168,85,247,.06);transition:background .15s}
    .list-row:last-child{border-bottom:none}
    .list-row:hover{background:rgba(168,85,247,.04)}
    .ibt{background:none;border:none;color:var(--text3);padding:5px;border-radius:7px;transition:all .15s;font-size:13px;cursor:pointer}
    .ibt:hover{background:rgba(255,255,255,.07);color:var(--text)}
    .ibt.del:hover{background:rgba(239,68,68,.1);color:#f87171}

    /* ── STATS ── */
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
    @media(max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
    .stat-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:10px}
    .stat-val{font-size:26px;font-weight:800;line-height:1}
    .stat-lbl{font-size:11px;color:var(--text2);margin-top:3px}

    /* ── SEARCH ── */
    .search-bar{display:flex;gap:10px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid rgba(168,85,247,.07)}
    .sw{position:relative;flex:1;min-width:160px}
    .sw-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
    .si{width:100%;padding:8px 10px 8px 32px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;outline:none}
    .si:focus{border-color:var(--p)}
    .si::placeholder{color:var(--text3)}
    .sfl{padding:8px 11px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;outline:none;cursor:pointer}

    /* ── PAGE HEADER / EMPTY ── */
    .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px}
    .pt{font-size:22px;font-weight:800;background:var(--grad2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent}
    .ps{color:var(--text2);font-size:13px;margin-top:2px}
    .empty{text-align:center;padding:56px 24px}
    .empty-ic{font-size:44px;margin-bottom:10px;opacity:.3}
    .empty-t{font-weight:600;color:var(--text2);margin-bottom:4px}
    .empty-s{color:var(--text3);font-size:13px;margin-bottom:18px}

    /* ── AUTH ── */
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
    .auth-box{position:relative;z-index:2;width:100%;max-width:420px;background:rgba(13,0,31,.92);border:1px solid var(--border);border-radius:22px;padding:34px}
    .auth-logo{text-align:center;margin-bottom:26px}
    .auth-logo-ic{width:50px;height:50px;background:var(--grad);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 10px}
    .auth-t{font-size:21px;font-weight:800}
    .auth-s{color:var(--text2);font-size:13px;margin-top:3px}
    .auth-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:9px 13px;font-size:13px;color:#f87171;margin-bottom:14px}
    .auth-foot{margin-top:18px;text-align:center;font-size:13px;color:var(--text2)}
    .auth-foot a{color:var(--p);cursor:pointer}

    /* ── LANDING ── */
    .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;padding:100px 24px 60px}
    .hero-paths{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .hc{position:relative;z-index:2;max-width:860px;margin:0 auto}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(124,58,237,.12);border:1px solid rgba(168,85,247,.4);border-radius:30px;padding:7px 18px;color:#c084fc;font-size:12px;font-weight:600;margin-bottom:28px}
    .hero-dot{width:6px;height:6px;border-radius:50%;background:var(--p);box-shadow:0 0 6px var(--p);display:inline-block;animation:pulse 2s infinite}
    .hero-title{font-size:clamp(2.8rem,8vw,6.5rem);font-weight:900;line-height:1.05;letter-spacing:-3px;margin-bottom:22px}
    .hero-title span{background:var(--grad2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent}
    .hero-sub{color:#d1d5db;font-size:clamp(.95rem,2.3vw,1.18rem);line-height:1.75;max-width:600px;margin:0 auto 40px}
    .hero-cta{display:inline-flex;align-items:center;gap:10px;background:var(--grad);color:#fff;font-weight:700;font-size:16px;padding:16px 40px;border-radius:14px;box-shadow:0 0 40px rgba(124,58,237,.4);transition:transform .2s,box-shadow .2s}
    .hero-cta:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(124,58,237,.6)}
    .hero-proof{margin-top:28px;color:var(--text3);font-size:12px}
    .land-sec{padding:88px 24px}
    .sl{color:var(--p);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:4px;display:block;margin-bottom:10px}
    .st{font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:900;line-height:1.15;margin-bottom:10px}
    .ss{color:var(--text2);font-size:16px}
    .feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin-top:50px}
    .feat-card{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:26px;transition:border-color .25s,transform .25s}
    .feat-card:hover{border-color:rgba(168,85,247,.35);transform:translateY(-4px)}
    .feat-ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:14px;background:rgba(124,58,237,.14)}
    .feat-t{font-size:15px;font-weight:700;margin-bottom:7px}
    .feat-d{color:var(--text2);font-size:13px;line-height:1.6}
    .feat-hl{color:var(--p);font-weight:600}
    .steps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:44px}
    .step-n{font-size:44px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent;margin-bottom:10px}
    .step-t{font-size:16px;font-weight:700;margin-bottom:7px}
    .step-d{color:var(--text2);font-size:13px;line-height:1.6}
    .testi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:44px}
    .testi{background:var(--card);border:1px solid var(--border2);border-radius:15px;padding:22px}
    .testi-stars{color:#f59e0b;font-size:13px;margin-bottom:10px}
    .testi-txt{color:#d1d5db;font-size:13px;line-height:1.65;margin-bottom:14px;font-style:italic}
    .testi-name{font-weight:700;font-size:13px}
    .testi-role{color:var(--text2);font-size:11px}
    .price-card{max-width:460px;margin:44px auto 0;background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(236,72,153,.08));border:1px solid rgba(168,85,247,.3);border-radius:22px;padding:38px;text-align:center}
    .price-tag{font-size:68px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent;line-height:1}
    .price-sub{color:var(--text2);margin:4px 0 24px}
    .price-feat{list-style:none;text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:28px}
    .price-feat li{display:flex;align-items:center;gap:7px;font-size:13px;color:#d1d5db}
    .price-feat li::before{content:'✓';color:var(--p);font-weight:700}
    .land-foot{border-top:1px solid var(--border);padding:28px 24px;text-align:center;color:var(--text3);font-size:13px}

    /* ── CHATBOT ── */
    .chat-fab{position:fixed;bottom:80px;right:18px;z-index:200;width:50px;height:50px;background:var(--grad);border-radius:50%;border:none;color:#fff;font-size:21px;cursor:pointer;box-shadow:0 4px 20px rgba(124,58,237,.5);transition:transform .2s;display:none;align-items:center;justify-content:center}
    .chat-fab:hover{transform:scale(1.08)}
    .chat-fab.show{display:flex}
    @media(min-width:769px){.chat-fab{bottom:22px}}
    .chat-panel{position:fixed;bottom:88px;right:18px;width:320px;background:var(--bg3);border:1px solid var(--border);border-radius:18px;z-index:200;box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;flex-direction:column}
    .chat-panel.open{display:flex}
    @media(min-width:769px){.chat-panel{bottom:82px}}
    @media(max-width:400px){.chat-panel{right:0;left:0;width:auto;border-radius:18px 18px 0 0;bottom:70px}}
    .chat-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
    .chat-msgs{height:240px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px}
    .chat-msg{padding:9px 13px;border-radius:13px;font-size:13px;line-height:1.5;max-width:84%}
    .chat-msg.u{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
    .chat-msg.b{background:rgba(255,255,255,.07);color:#e2e8f0;align-self:flex-start;border-bottom-left-radius:3px}
    .chat-ir{padding:10px;border-top:1px solid var(--border);display:flex;gap:7px}
    .chat-in{flex:1;padding:8px 11px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;outline:none}
    .chat-in:focus{border-color:var(--p)}
    .chat-send{background:var(--grad);color:#fff;border:none;border-radius:9px;padding:8px 13px;cursor:pointer;font-size:14px}

    /* ── SCRIPT ── */
    .script-out{background:rgba(124,58,237,.07);border:1px solid rgba(168,85,247,.2);border-radius:15px;padding:22px;margin-top:18px}
    @media(max-width:768px){.scripts-cols{grid-template-columns:1fr !important}}

    /* ── APPT CARD ── */
    .appt-card{background:var(--card);border:1px solid var(--border2);border-radius:15px;overflow:hidden;margin-bottom:12px;transition:box-shadow .2s}
    .appt-card:hover{box-shadow:0 4px 20px rgba(124,58,237,.1)}
    .appt-bar{height:3px}
    .appt-body{padding:16px 18px}

    /* ── TOASTS ── */
    #toasts{position:fixed;top:74px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px}
    .toast{padding:11px 16px;border-radius:11px;font-size:13px;font-weight:500;max-width:280px;animation:tst .3s ease}
    .t-ok{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.3);color:#4ade80}
    .t-err{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.3);color:#f87171}

    /* ── ANIMATIONS ── */
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes pathFade{0%,100%{opacity:.18}50%{opacity:.72}}
    @keyframes tst{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fin{animation:fin .35s ease}
    .div{height:1px;background:var(--border);margin:20px 0}
    /* letter-by-letter hero */
    @keyframes letterIn{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:translateY(0)}}
    .hl{display:inline-block;opacity:0;animation:letterIn .7s cubic-bezier(.2,.8,.2,1) forwards}
    /* DEMO SECTION */
    .demo-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:50px}
    @media(max-width:900px){.demo-grid{grid-template-columns:1fr}}
    .demo-main{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:20px;padding:10px;position:relative;overflow:hidden;min-height:380px;display:flex}
    .demo-main video,.demo-main img{width:100%;height:100%;object-fit:cover;border-radius:14px}
    .demo-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,0,25,.35);cursor:pointer;transition:background .3s;border:none;border-radius:14px}
    .demo-play:hover{background:rgba(10,0,25,.15)}
    .demo-play span{width:74px;height:74px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;box-shadow:0 0 40px rgba(124,58,237,.6)}
    .demo-feats{display:grid;grid-template-rows:repeat(4,1fr);gap:12px}
    .demo-feat{background:rgba(255,255,255,.03);border:1px solid var(--border2);border-radius:14px;padding:14px 16px;transition:border-color .25s,transform .25s}
    .demo-feat:hover{border-color:rgba(168,85,247,.4);transform:translateX(4px)}
    .demo-feat h4{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff}
    .demo-feat p{font-size:11.5px;color:var(--text2);line-height:1.5}
    .integ-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:40px}
    @media(max-width:760px){.integ-grid{grid-template-columns:repeat(2,1fr)}}
    .integ{display:flex;align-items:center;gap:10px;padding:12px;border-radius:13px;transition:background .2s}
    .integ:hover{background:rgba(168,85,247,.07)}
    .integ-ic{width:38px;height:38px;border-radius:10px;background:rgba(124,58,237,.14);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .integ-n{font-size:13px;font-weight:600}
    .integ-s{font-size:11px;color:var(--text2)}
  </style>
</head>
<body>
<div id="toasts"></div>
<div id="app"></div>
<script>
'use strict'

/* ── UTILS ── */
const $  = (s,c=document) => c.querySelector(s)
const uid = () => Math.random().toString(36).slice(2,10)
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
function animTitle(text,grad,offset=0){
  return text.split('').map((ch,i)=>{
    const c=ch===' '?'&nbsp;':esc(ch)
    const style=`animation-delay:${0.3+(offset+i)*0.045}s;${grad?'background:var(--grad2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent':''}`
    return `<span class="hl" style="${style}">${c}</span>`
  }).join('')
}
function toast(msg,type='ok'){
  const t=document.createElement('div')
  t.className=`toast t-${type}`; t.textContent=msg
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(),3000)
}

/* ── STORAGE ── */
const S={
  get:(k,d=null)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),
  del:(k)=>localStorage.removeItem(k),
}

/* ── AUTH ── */
const Auth={
  me:()=>S.get('pp_me'),
  loggedIn:()=>!!Auth.me(),
  register(name,email,pw){
    const users=S.get('pp_users',[])
    if(users.find(u=>u.email.toLowerCase()===email.toLowerCase())) return{err:'Email déjà utilisé.'}
    const u={id:uid(),name,email,pw,at:Date.now()}
    users.push(u); S.set('pp_users',users); S.set('pp_me',{id:u.id,name,email})
    return{ok:true}
  },
  login(email,pw){
    const u=S.get('pp_users',[]).find(u=>u.email.toLowerCase()===email.toLowerCase()&&u.pw===pw)
    if(!u) return{err:'Email ou mot de passe incorrect.'}
    S.set('pp_me',{id:u.id,name:u.name,email:u.email}); return{ok:true}
  },
  logout(){S.del('pp_me');go('#/')}
}

/* ── DATABASE (per-user localStorage) ── */
function mk(t){
  const key=()=>`pp_${Auth.me()?.id}_${t}`
  return{
    all:()=>S.get(key(),[]),
    add:(o)=>{const d=mk(t).all();d.unshift({...o,id:uid(),at:Date.now()});S.set(key(),d)},
    upd:(id,o)=>{S.set(key(),mk(t).all().map(x=>x.id===id?{...x,...o}:x))},
    del:(id)=>S.set(key(),mk(t).all().filter(x=>x.id!==id)),
  }
}
const Calls=mk('calls'), Appts=mk('appts'), Pros=mk('pros')

/* ── AI ── */
async function askAI(system,userMsg){
  const r=await fetch('/.netlify/functions/ai',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({system,messages:[{role:'user',content:userMsg}]})
  })
  if(!r.ok) throw new Error('Erreur API ('+r.status+')')
  const d=await r.json()
  if(d.error) throw new Error(d.error)
  return d.content?.[0]?.text||''
}

/* ── MAGNETIC BUTTONS (desktop only) ── */
let _magBound=false
function bindMagnetic(){
  if(window.innerWidth<900) return
  document.querySelectorAll('.magnetic').forEach(el=>{
    if(el.dataset.mag) return
    el.dataset.mag='1'
    el.style.transition='transform .25s cubic-bezier(.2,.8,.2,1)'
    el.addEventListener('mousemove',e=>{
      const r=el.getBoundingClientRect()
      const mx=e.clientX-(r.left+r.width/2)
      const my=e.clientY-(r.top+r.height/2)
      el.style.transform=`translate(${mx*0.35}px,${my*0.45}px)`
    })
    el.addEventListener('mouseleave',()=>{el.style.transform='translate(0,0)'})
  })
}

  const n=$('#sn').value.trim(),c=$('#sc').value.trim()
  if(!n||!c){toast('Nom et entreprise requis.','err');return}
  const s=$('#ss').value.trim(),t=$('#st').value
  const infos=[$('#si1').value.trim(),$('#si2').value.trim(),$('#si3').value.trim()].filter(Boolean)
  const btn=$('#sgen');btn.textContent='⏳ Génération...';btn.disabled=true
  $('#sout').innerHTML=`<div style="padding:60px;text-align:center;color:var(--text2)"><div style="font-size:30px;margin-bottom:10px">⏳</div>Génération du script en cours...</div>`
  try{
    const res=await askAI(
      `Tu es un expert en vente B2B et prospection commerciale. Tu génères des scripts d'appel professionnels et naturels en français. Structure toujours en 3 parties: **OUVERTURE** (accroche 3 lignes), **PITCH** (valeur + questions 4-5 lignes), **OBJECTIONS & CLOSING** (réponses + demande RDV 4-5 lignes).`,
      `Génère un script de type "${t}" pour:\n- Prospect: ${n}, ${c}${s?`\n- Secteur: ${s}`:''}${infos.length?`\n- Infos clés: ${infos.join(', ')}`:''}.\nLe script doit être naturel, personnalisé et finir par une proposition de RDV.`
    )
    showScript(`✨ Script pour ${n} — ${c}`,res)
  }catch(e){$('#sout').innerHTML=`<div class="card" style="border-color:rgba(239,68,68,.3);color:#f87171;padding:20px">❌ ${esc(e.message)}</div>`}
  btn.textContent='✨ Générer le script IA';btn.disabled=false
}
function loadPreset(t){if(PRESETS[t])showScript(`📝 ${t}`,PRESETS[t])}
function showScript(title,text){
  $('#sout').innerHTML=`<div class="script-out">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-weight:700;color:var(--p);font-size:13px">${esc(title)}</span>
      <button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('stxt').innerText).then(()=>toast('Copié !'))">📋 Copier</button>
    </div>
    <pre id="stxt" style="white-space:pre-wrap;font-size:13px;line-height:1.8;color:#e2d9f3;font-family:inherit">${esc(text)}</pre>
  </div>`
}

}

dispatch()
